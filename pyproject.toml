[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citizenship-score"
version = "0.1.0"
description = "Phase 0 scoring engine for the citizenship habit/workout tracker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
citizenship-score = "citizenship_score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# backend/ has its own venv and test suite; keep root pytest to Phase 0.
testpaths = ["tests"]
